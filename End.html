<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerrando formulario...</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#f5f6f8;font-family:Arial,sans-serif;color:#202124}
  .box{background:#fff;padding:35px 40px;border-radius:18px;text-align:center;
  box-shadow:0 10px 35px rgba(0,0,0,.10)}
</style>
</head>
<body>
<div class="box">
  <div style="font-size:34px">✓</div>
  <h2>Cerrando formulario...</h2>
  <p>Regresando al CRM.</p>
</div>

<script>
(function closeForm() {
  // Intenta cerrar la pestaña automáticamente.
  window.close();

  // Segundo intento después de un breve intervalo.
  setTimeout(function () {
    window.open('', '_self');
    window.close();
  }, 150);

  // Si el navegador bloquea el cierre, deja una alternativa visible.
  setTimeout(function () {
    document.querySelector('.box').innerHTML =
      '<div style="font-size:34px">✓</div>' +
      '<h2>Formulario enviado</h2>' +
      '<p>La información fue guardada correctamente.</p>' +
      '<button onclick="window.open(\'\',\'_self\');window.close();" ' +
      'style="border:0;border-radius:10px;padding:12px 22px;background:#ed1b2f;color:#fff;font-weight:700;cursor:pointer;font-size:15px">' +
      'Cerrar formulario</button>';
  }, 700);
})();
</script>
</body>
</html>
