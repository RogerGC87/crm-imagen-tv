<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cerrar formulario | CRM VENTAS - IMAGEN TV</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f6f8;
      font-family: Arial, sans-serif;
      color: #202124;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,.10);
      max-width: 420px;
      width: calc(100% - 40px);
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 0 0 24px; color: #666; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 22px;
      background: #ed1b2f;
      color: white;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>✓ Formulario enviado</h1>
    <p>La información fue guardada correctamente. Puedes cerrar esta pestaña.</p>
    <button onclick="closeTab()">Cerrar formulario</button>
  </div>

  <script>
    function closeTab() {
      window.open('', '_self');
      window.close();
    }
  </script>
</body>
</html>
